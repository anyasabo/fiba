# WNBA players on 2026 FIBA World Cup national teams.
#
# Transcribed by hand, originally from High Post Hoops, "Every WNBA player who
# will play in the 2026 FIBA World Cup in Berlin", 7 Aug 2026, and reconciled
# against WNBA.com's official list, as of 3 Sep 2026, and FIBA's published twelves.
# Re-download the sources with `uv run fiba-wwc fetch-sources`.
#
# status: confirmed   -- on the twelve their federation has published
#         unconfirmed -- in a preselect pool / expected but not yet named
#
# `fiba-wwc check` holds this against FIBA's team pages both ways: a player
# here who is not in her nation's twelve fails, and so does a squad member at a
# WNBA club who is missing from here. A mid-tournament injury replacement will
# trip it, and the fix is an edit here.
#
# Keyed by FIBA tricode (must match data/schedule.yaml `teams`). Puerto Rico's
# twelve contains only former WNBA players, so it has no entry.
#
# fiba_name: only where FIBA spells the player differently and
# OURS is the spelling to keep -- a current surname FIBA has not caught up with,
# a diacritic it strips, a given name it shortens, or Chinese surname-first
# order. It means "reviewed, keeping ours" and stops `check` reporting the
# difference every run. Where FIBA was simply right, the name here was fixed
# instead and no alias exists.

