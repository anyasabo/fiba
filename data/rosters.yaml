# WNBA players on 2026 FIBA World Cup national teams.
#
# Transcribed by hand from High Post Hoops, "Every WNBA player who will
# play in the 2026 FIBA World Cup in Berlin", 7 Aug 2026.
# Re-download it with `uv run fiba-wwc fetch-sources`.
#
# status: confirmed   -- named on a finalised national-team roster
#         unconfirmed -- in a preselect pool / expected but not yet named.
#                        These came from the article's "Others:" paragraphs.
#
# Keyed by FIBA tricode (must match data/schedule.yaml `teams`). Nigeria and
# Puerto Rico have no WNBA players in the source article and so have no entry.
#
# To update as rosters firm up: flip a status to confirmed, or add a line.

