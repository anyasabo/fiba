# WNBA clubs for the 2026 season (15 teams, including the Toronto Tempo and
# Portland Fire expansion sides).
#
# logo_id is the WNBA CDN team id, resolved from https://www.wnba.com/teams:
#   https://cdn.wnba.com/logos/wnba/{logo_id}/primary/L/logo.{svg,png}
# `fiba-wwc fetch-logos` downloads these into assets/logos/{abbr}.{svg,png}.
#
# primary/secondary are the clubs' OFFICIAL brand hex values (teamcolorcodes /
# trucolor). They are not always identical to the fills inside the logo art --
# where they differ, the brand value is the right one for UI chrome.
#
# Exception, deliberately: Toronto. Some colour directories list the Tempo as
# royal blue #0050B5, but the fill in Toronto's own primary logo SVG on the WNBA
# CDN is plum #441E36, and the rendered mark is visibly plum. The logo wins.
#
# Colours are DECORATION ONLY. Every rendered player row carries the club
# abbreviation as text beside the logo, so the output stays readable on a
# black-and-white printer with no colour at all.

ATL: {name: Atlanta Dream,          city: Atlanta,       logo_id: 1611661330, primary: "#C8102E", secondary: "#418FDE"}
CHI: {name: Chicago Sky,            city: Chicago,       logo_id: 1611661329, primary: "#418FDE", secondary: "#FFCD00"}
CON: {name: Connecticut Sun,        city: Connecticut,   logo_id: 1611661323, primary: "#FF671F", secondary: "#0C2340"}
DAL: {name: Dallas Wings,           city: Dallas,        logo_id: 1611661321, primary: "#0C2340", secondary: "#C4D600"}
GSV: {name: Golden State Valkyries, city: Golden State,  logo_id: 1611661331, primary: "#AD96DC", secondary: "#010101"}
