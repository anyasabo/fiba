LVA: {name: Las Vegas Aces,         city: Las Vegas,     logo_id: 1611661319, primary: "#BA0C2F", secondary: "#000000"}
LAS: {name: Los Angeles Sparks,     city: Los Angeles,   logo_id: 1611661320, primary: "#4A2583", secondary: "#FFC72C"}
MIN: {name: Minnesota Lynx,         city: Minnesota,     logo_id: 1611661324, primary: "#0C2340", secondary: "#236192"}
NYL: {name: New York Liberty,       city: New York,      logo_id: 1611661313, primary: "#6ECEB2", secondary: "#000000"}
PHX: {name: Phoenix Mercury,        city: Phoenix,       logo_id: 1611661317, primary: "#1D1160", secondary: "#E56020"}
