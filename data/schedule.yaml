  PUR: {name: Puerto Rico,  flag: "🇵🇷"}
  TUR: {name: Türkiye,      flag: "🇹🇷"}
  USA: {name: USA,          flag: "🇺🇸"}
  CZE: {name: Czechia,      flag: "🇨🇿"}
  ITA: {name: Italy,        flag: "🇮🇹"}
  CHN: {name: China,        flag: "🇨🇳"}

