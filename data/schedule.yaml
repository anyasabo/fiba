# Transcribed by hand from fiba-womens-basketball-world-cup-208875-game-schedule.pdf
# (pdftotext -layout). The PDF lists each tip-off twice: Berlin local and GMT.
# Berlin is CEST (UTC+2) in September and every pair differs by exactly 2h, so the
# GMT column is true UTC -- that is what is stored here. All display timezones are
# derived from it.
#
# `number` is OUR key, 1..36, chronological. It is NOT FIBA's game number (theirs is
# per-group: 29919-A-1 .. 29919-D-6). data/fiba_scraped.yaml maps between them.

tournament:
  name: FIBA Women's Basketball World Cup 2026
  city: Berlin
  local_tz: Europe/Berlin
  fiba_event_slug: fiba-womens-basketball-world-cup-2026
  # Two arenas run parallel slots (note the duplicate 09:30 UTC tip-offs). The PDF's
  # column layout does not say which game is where, so venue stays null until the
  # scrape or the FIBA site confirms it.
  venues:
    - Berlin Arena
    - Max-Schmeling-Halle

groups:
  A: [JPN, ESP, GER, MLI]
  B: [HUN, KOR, NGR, FRA]
  C: [BEL, AUS, PUR, TUR]
  D: [USA, CZE, ITA, CHN]

teams:
  JPN: {name: Japan,        flag: "🇯🇵"}
  ESP: {name: Spain,        flag: "🇪🇸"}
  GER: {name: Germany,      flag: "🇩🇪"}
