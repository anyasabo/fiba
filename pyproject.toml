[project]
name = "fiba-wwc"
version = "0.1.0"
description = "Schedule, rosters and broadcast listings for the FIBA Women's Basketball World Cup 2026"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
fiba-wwc = "fiba_wwc.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# En dashes and middots are deliberate typography in the rendered output.
ignore = ["RUF001"]
